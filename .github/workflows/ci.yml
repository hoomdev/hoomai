name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: build
        run: go build -mod=vendor ./...
      - name: vet
        run: go vet -mod=vendor ./...
      - name: test
        run: go test -mod=vendor ./...
      # dogfood: hoomAI se verifica a si mismo
      - name: hoom verify (dogfood)
        run: |
          go build -mod=vendor -o /usr/local/bin/hoom ./cmd/hoom
          hoom verify --gate build,static,test
