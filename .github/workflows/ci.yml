name: ci
on:
  push:
    branches: [main]
  pull_request:
# el job solo lee el repo: el token no puede escribir nada
permissions:
  contents: read
jobs:
  # TEMPORAL (no se fusiona): diagnostico de por que un bwrap anidado no crea
  # su espacio de usuario en el runner (TestCA680/TestCA683 rojos en main)
  diagnostico-bwrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      - name: encierro
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-utils
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - name: diagnostico
        run: |
          set +e
          uname -a; grep -E '^(NAME|VERSION)=' /etc/os-release
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.apparmor_restrict_unprivileged_unconfined kernel.apparmor_restrict_unprivileged_io_uring kernel.unprivileged_userns_clone user.max_user_namespaces; do sysctl "$k" 2>&1; done
          echo "--- etiqueta de este shell: $(cat /proc/self/attr/current 2>&1)"
          echo "--- perfiles de AppArmor con bwrap/userns:"; sudo aa-status 2>&1 | grep -i -E 'bwrap|userns|unpriv|profiles are' 
          ls -la /etc/apparmor.d/ | grep -i -E 'bwrap|userns|unpriv'
          echo "--- 1 simple:"; bwrap --ro-bind / / true && echo simple=si || echo simple=no
          echo "--- 2 etiqueta adentro:"; bwrap --ro-bind / / cat /proc/self/attr/current
          echo "--- 3 max_user_namespaces adentro:"; bwrap --ro-bind / / cat /proc/sys/user/max_user_namespaces
          echo "--- 4 anidado:"; bwrap --ro-bind / / bwrap --ro-bind / / true && echo anidado=si || echo anidado=no
          echo "--- 5 anidado con las banderas del encierro:"; bwrap --unshare-user --unshare-pid --new-session --die-with-parent --ro-bind / / --dev /dev --proc /proc bwrap --ro-bind / / true && echo anidado-encierro=si || echo anidado-encierro=no
          echo "--- 6 unshare -U adentro:"; bwrap --ro-bind / / unshare -U true && echo unshare=si || echo unshare=no
          echo "--- 7 dmesg:"; sudo dmesg 2>&1 | grep -i -E 'apparmor|userns' | tail -20
          exit 0
      - name: tests que fallan en main
        run: |
          go test -mod=vendor -count=1 -v -run 'TestCA680_EspaciosDeUsuarioAnidados' ./internal/encierro/
          go test -mod=vendor -count=1 -v -run 'TestCA683_ConSobreElGateCorreEncerrado' ./internal/verifycmd/
  verify:
    if: github.head_ref != 'ci/diagnostico-bwrap-anidado'
    runs-on: ubuntu-latest
    steps:
      # sin persist-credentials el token no queda en .git/config, donde lo
      # leeria cualquier paso posterior, el contenedor de semgrep incluido
      # (hallazgo fb0761)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25"
      # herramientas de los gates lint y security. golangci-lint: la version se
      # fija aca (v2.15.0); .golangci.yml solo configura los linters.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          install-only: true
      # semgrep: la imagen oficial 1.175.0 fijada por digest, que cubre el
      # motor y todas sus dependencias; el comando semgrep del PATH la corre
      # sobre el checkout. La version tiene que coincidir con
      # .hoom/semgrep/paquetes.lock.
      - name: semgrep
        env:
          SEMGREP_IMAGEN: semgrep/semgrep:1.175.0@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796
        run: |
          docker pull "$SEMGREP_IMAGEN"
          echo "SEMGREP_IMAGEN=$SEMGREP_IMAGEN" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/bin"
          install -m 755 .github/semgrep-en-docker.sh "$RUNNER_TEMP/bin/semgrep"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/semgrep" --version
      # los clones de los repos de reglas que gate.sh baja a
      # .hoom/cache/semgrep: con la entrada en el cache (clave: el lock), el
      # gate no vuelve a bajarlos. Sin ella (lock nuevo, o la entrada
      # expiro) gate.sh los baja de GitHub en el commit que fija el lock.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .hoom/cache/semgrep
          key: semgrep-reglas-${{ hashFiles('.hoom/semgrep/paquetes.lock') }}
      # el encierro (contencion-del-writer): bwrap, y espacios de usuario sin
      # privilegios, que AppArmor de Ubuntu 24.04 no deja crear por defecto;
      # sin esto los tests del encierro ven el nivel ninguno
      - name: encierro
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --version
      - name: build
        run: go build -mod=vendor ./...
      - name: vet
        run: go vet -mod=vendor ./...
      - name: test
        run: go test -mod=vendor ./...
      # dogfood: hoomAI se verifica a si mismo
      - name: hoom verify (dogfood)
        run: |
          go build -mod=vendor -o /usr/local/bin/hoom ./cmd/hoom
          hoom verify --gate build,static,test,lint,security || {
            # el reporte muestra solo las ultimas lineas de cada gate: aca va
            # lo que el veredicto guardo del que fallo, para ver que paquete fue
            jq -r '.gates[] | select(.status == "fail" or .status == "error") | "--- gate \(.name): salida guardada\n\(.output_tail)"' "$(ls -t .hoom/verdicts/*.json | head -1)"
            exit 1
          }
