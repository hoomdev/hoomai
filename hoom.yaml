# hoomAI verificandose a si mismo (dogfood)
schema: hoom/v1
project: hoomai
profile: go
base_branch: main
policy: strict
gates:
  mutation:
    required: false
    cmd: ""
    # Gremlins se corre manualmente por ahora; se activara cuando haya suite de tests.
  lint:
    required: false
    cmd: ""
  arch:
    required: false
    cmd: ""
# Los hallazgos high abiertos ponen ROJO a verify (gate findings_open).
findings:
  block_on: high
# El reviewer de hoom review. `hoom review` lee esta seccion del hoom.yaml de
# la BASE (el merge-base con main), nunca del cambio que revisa: un cambio no
# elige a su propio reviewer. Modelo y esfuerzo explicitos; el tope de la
# evidencia sube a 448 KiB (~150k tokens de los 258k de la ventana de Codex:
# el maximo que deja lugar para que el reviewer lea y razone).
review:
  model: gpt-5.6-sol
  effort: xhigh
  max_evidence_kib: 448
