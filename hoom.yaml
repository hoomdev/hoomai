# hoomAI verificandose a si mismo (dogfood)
schema: hoom/v1
project: hoomai
profile: go
base_branch: main
policy: strict
gates:
  test:
    # cmd completo con -race para verify --full y cierre; diff_cmd sin -race
    # para iterar rapido en sobres intermedios.
    cmd: "go test -race -timeout 20m ./..."
    diff_cmd: "go test -timeout 10m {packages}"
  mutation:
    required: false
    cmd: ""
    # Gremlins se corre manualmente por ahora; se activara cuando haya suite de tests.
  lint:
    # golangci-lint con .golangci.yml: govet, ineffassign, staticcheck y
    # unused sobre el codigo que se entrega (los tests no)
    required: true
    cmd: "golangci-lint run ./..."
  security:
    # semgrep con reglas fijadas: las de la comunidad por commit de git y la
    # version del motor en .hoom/semgrep/paquetes.lock, mas las propias de
    # .hoom/semgrep/reglas/. .semgrepignore deja fuera vendor y los tests.
    # Cada excepcion vive en el codigo como nosemgrep con su razon.
    required: true
    cmd: "sh .hoom/semgrep/gate.sh"
  arch:
    required: false
    cmd: ""
# Los hallazgos high abiertos ponen ROJO a verify (gate findings_open).
findings:
  block_on: high
  max_rondas: 1
# Niveles por rol y riesgo: hoom los traduce al modelo de cada provider.
agents:
  arquitecto: { model: fuerte, effort: high, bajo: { model: medio, effort: medium } }
  designer: { model: medio, effort: medium }
  scout: { model: barato, effort: low }
  writer: { model: medio, effort: medium, alto: { model: fuerte, effort: high } }
  test-writer: { model: medio, effort: medium, alto: { model: fuerte, effort: high } }
  characterizer: { model: medio, effort: medium, alto: { model: fuerte, effort: high } }
  analista: { model: medio, effort: medium }
  refutador: { model: medio, effort: medium, alto: { model: fuerte, effort: high } }
# El reviewer de hoom review. `hoom review` lee esta seccion del hoom.yaml de
# la BASE (el merge-base con main), nunca del cambio que revisa: un cambio no
# elige a su propio reviewer.
review:
  model: medio
  effort: high
  max_evidence_kib: 576
  concurrencia: 2
