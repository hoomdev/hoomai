# hoomAI verificandose a si mismo (dogfood)
schema: hoom/v1
project: hoomai
profile: go
base_branch: main
policy: strict
gates:
  test:
    # el mismo comando del perfil con un tope propio: sin -timeout, go test
    # corta cada paquete a los 10 minutos, y reviewcmd con -race ya tarda
    # ~550 s en una Mac; con la maquina ocupada daba rojo por tiempo sin
    # ningun defecto (hallazgo 20261007T145523_e3a958)
    cmd: "go test -race -timeout 20m ./..."
    diff_cmd: "go test -race -timeout 20m {packages}"
  mutation:
    required: false
    cmd: ""
    # Gremlins se corre manualmente por ahora; se activara cuando haya suite de tests.
  lint:
    # golangci-lint con .golangci.yml: govet, ineffassign, staticcheck y
    # unused sobre el codigo que se entrega (los tests no)
    required: true
    cmd: "golangci-lint run ./..."
  security:
    # semgrep con reglas fijadas: los paquetes de la comunidad por sha256 y la
    # version del motor en .hoom/semgrep/paquetes.lock, mas las propias de
    # .hoom/semgrep/reglas/. .semgrepignore deja fuera vendor y los tests.
    # Cada excepcion vive en el codigo como nosemgrep con su razon.
    required: true
    cmd: "sh .hoom/semgrep/gate.sh"
  arch:
    required: false
    cmd: ""
# Los hallazgos high abiertos ponen ROJO a verify (gate findings_open).
findings:
  block_on: high
# El reviewer de hoom review. `hoom review` lee esta seccion del hoom.yaml de
# la BASE (el merge-base con main), nunca del cambio que revisa: un cambio no
# elige a su propio reviewer. Modelo y esfuerzo explicitos; el tope de la
# evidencia sube a 448 KiB (~150k tokens de los 258k de la ventana de Codex:
# el maximo que deja lugar para que el reviewer lea y razone).
review:
  model: gpt-5.6-sol
  effort: xhigh
  max_evidence_kib: 448
