pedido: 'Spec .hoom/specs/tablero-tu-siguiente-paso.md (CA-696..721, firmado 8a14b1e4): hoom tablero v3. Cabecera de una linea, caja TU SIGUIENTE PASO, lista agrupada por quien tiene la pelota (TE TOCA, CORRIENDO, DETENIDA, EN COLA, HECHO), detalle AHORA / TE TOCA / SIGUE / EL CAMINO, Seguir solo (P, hoom piloto desprendido), la firma encadena el piloto, enter abre el modal del paso, n, H, v, L; boardcmd.Red.Esperado. Re-expresa 11 criterios de tablero-con-paneles.'
