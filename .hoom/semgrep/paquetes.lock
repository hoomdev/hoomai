# Reglas que corre el gate security, fijadas para que el mismo arbol de el
# mismo veredicto (hallazgo 20261022T200644_60cd29).
#
# Las reglas salen de los repos publicos de semgrep y de Trail of Bits, en un
# commit fijo: git comprueba el contenido por el commit, asi que el mismo lock
# trae siempre los mismos bytes. El registro (semgrep.dev/c/p/...) no sirve
# para esto: su CDN entrega versiones distintas del mismo paquete segun la
# region, y el paquete cambia casi a diario.
#
# semgrep <version>
#   La version del motor; otra version es un error del gate.
# repo <nombre> <carpeta> <url> <commit>
#   Un repo de reglas. .hoom/semgrep/gate.sh lo baja a .hoom/cache/semgrep/
#   (las reglas no se copian al repo: su licencia no lo permite) y arma cada
#   archivo en <carpeta>/<ruta sin extension>/<archivo>: asi semgrep nombra
#   cada regla igual que el registro (go.lang..., trailofbits.go...) y los
#   nosemgrep del codigo siguen valiendo.
# <nombre> <ruta>
#   Un archivo de reglas de ese repo, en ese commit.
#
# La lista son las reglas de p/default y p/trailofbits (registro, 2026-10-23)
# cuyo lenguaje tiene archivos en hoomai: go, javascript, html, json, yaml,
# generic, regex y bash. Sobre el arbol de main corren las mismas 395 reglas
# que corria el registro, con los mismos 0 hallazgos.
#
# Actualizar (cambiar un commit, sumar o quitar archivos) es un acto
# deliberado: revisar el diff de las reglas entre los dos commits. Una ruta que
# ya no existe en el commit es un error del gate.
