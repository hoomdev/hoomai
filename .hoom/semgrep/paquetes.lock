# Reglas que corre el gate security, fijadas para que el mismo arbol de el
# mismo veredicto (hallazgo 20261022T200644_60cd29).
#
# Las reglas salen de los repos publicos de semgrep y de Trail of Bits, en un
# commit fijo, y cada archivo con su sha256: .hoom/semgrep/gate.sh comprueba en
# cada corrida que lo que va a correr es exactamente lo que fija este lock,
# venga de un clon del cache o de una bajada nueva. El registro
# (semgrep.dev/c/p/...) no sirve para esto: su CDN entrega versiones distintas
# del mismo paquete segun la region, y el paquete cambia casi a diario.
#
# semgrep <version>
#   La version del motor; otra version es un error del gate.
# repo <nombre> <carpeta> <url> <commit>
#   Un repo de reglas, declarado antes que sus archivos. gate.sh lo baja a
#   .hoom/cache/semgrep/ (las reglas no se copian al repo: su licencia no lo
#   permite) y arma cada archivo en <carpeta>/<ruta sin extension>/<archivo>:
#   asi el id de cada regla termina en el del registro (go.lang...,
#   trailofbits.go...) y los nosemgrep del codigo, que se comparan por ese
#   final, siguen valiendo.
# <nombre> <ruta> <sha256>
#   Un archivo de reglas de ese repo en ese commit, con el sha256 de su
#   contenido.
#
# La lista son los archivos de las reglas de p/default y p/trailofbits
# (registro, 2026-10-23) cuyo lenguaje tiene archivos en hoomai: go,
# javascript, html, json, yaml, generic, regex y bash. Son 440 reglas (429
# archivos); sobre el arbol de main semgrep corre 395 de ellas (las demas no
# tienen archivos de su lenguaje), las mismas 395 que corria con los paquetes
# del registro, con los mismos 0 hallazgos.
#
# Actualizar es un acto deliberado: cambiar el commit o la lista, correr
# `sh .hoom/semgrep/fijar.sh` (rehace los sha256 desde una bajada nueva) y
# revisar el diff de las reglas entre los dos commits.
