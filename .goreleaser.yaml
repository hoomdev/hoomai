# hoomAI — configuracion de release
# Cada tag vX.Y.Z publica binarios con nombre estable (hoom-<os>-<arch>)
# para que install.sh pueda usar releases/latest/download/.
version: 2
project_name: hoomai

builds:
  - id: hoom
    main: ./cmd/hoom
    binary: hoom
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: binaries
    formats: ["binary"]
    name_template: "hoom-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc

release:
  footer: |
    ## Instalacion en un comando
    ```sh
    curl -fsSL https://raw.githubusercontent.com/hoomdev/hoomai/main/install.sh | sh
    ```
